name: Intraday Price Refresh

on:
  schedule:
    - cron: "30 16 * * 1-5"
    - cron: "30 18 * * 1-5"
    - cron: "30 20 * * 1-5"
    - cron: "0 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch prices & rebuild page (using cached daily data)
        run: python fetch_prices.py

      - name: Commit & push
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add docs/index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Intraday price refresh"
          git push

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "市场简报 - 盘中刷新"
          to: ${{ secrets.EMAIL_TO }}
          from: Market Briefing Bot
          body: file://email_body.txt

name: Update Market Briefing

on:
  schedule:
    - cron: "30 14 * * 1-5"
    - cron: "30 16 * * 1-5"
    - cron: "30 18 * * 1-5"
    - cron: "30 20 * * 1-5"
    - cron: "0 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data & build HTML
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python fetch_and_build.py

      - name: Commit & push updated site
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add docs/index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto update market briefing"
          git push

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "市场简报更新 - ${{ github.run_id }}"
          to: ${{ secrets.EMAIL_TO }}
          from: Market Briefing Bot
          body: file://email_body.txt
